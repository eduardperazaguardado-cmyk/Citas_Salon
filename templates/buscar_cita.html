<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas - DanasNails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #fdf2f8;
            font-family: 'Poppins', sans-serif;
        }

        .salon-title {
            font-family: 'Playfair Display', serif;
            color: #831843;
        }

        .card-custom {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(225, 29, 72, 0.1);
        }

        .btn-custom {
            background-color: #fb7185;
            color: white;
            border-radius: 10px;
            padding: 10px 20px;
        }

        .btn-custom:hover {
            background-color: #e11d48;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom p-4 p-md-5">
                    <h2 class="salon-title fw-bold text-center mb-4">Buscar mi Cita</h2>

                    <!-- Formulario para buscar por teléfono -->
                    <form action="/mis_citas" method="POST" class="mb-4">
                        <label class="form-label text-secondary fw-medium">Ingresa el teléfono con el que
                            reservaste</label>
                        <div class="input-group">
                            <input type="tel" class="form-control" name="telefono" placeholder="Ej. 7777-7777" required>
                            <button type="submit" class="btn btn-custom">Buscar</button>
                        </div>
                    </form>

                    <!-- Resultados de la búsqueda -->
                    {% if citas != None %}
                    {% if citas|length > 0 %}
                    <h5 class="mb-3 text-secondary">Tus citas pendientes:</h5>
                    {% for cita in citas %}
                    <div class="p-3 mb-3 border rounded shadow-sm"
                        style="background-color: white; border-color: #fbcfe8 !important;">
                        <p class="mb-1"><strong>Servicio:</strong> {{ cita[1] }}</p>
                        <p class="mb-1"><strong>Fecha:</strong> {{ cita[2] }} a las <span class="text-danger fw-bold">{{
                                cita[3] }}</span></p>

                        <!-- Botón para que la clienta cancele -->
                        <form action="/cancelar_cliente" method="POST" class="mt-3">
                            <input type="hidden" name="id_cita" value="{{ cita[0] }}">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100"
                                onclick="return confirm('¿Estás segura de que deseas cancelar esta cita? El espacio se liberará.');">❌
                                Cancelar mi cita</button>
                        </form>
                    </div>
                    {% endfor %}
                    {% else %}
                    <div class="alert alert-warning text-center"
                        style="background-color: #fff1f2; border: none; color: #e11d48;">
                        No encontramos citas pendientes con ese número.
                    </div>
                    {% endif %}
                    {% endif %}

                    <a href="/" class="d-block text-center mt-3 text-decoration-none fw-medium"
                        style="color: #fb7185;">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
