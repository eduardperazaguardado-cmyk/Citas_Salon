<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cita Confirmada - DanasNails</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #fdf2f8;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            height: 100vh;
        }

        h1,
        .salon-title {
            font-family: 'Playfair Display', serif;
            color: #cca43b;
        }

        .card-custom {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(225, 29, 72, 0.1);
        }

        .btn-custom {
            background-color: #f0c862;
            border-color: #cca43b;
            color: white;
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #cca43b;
            color: white;
        }

        .icon-huge {
            font-size: 4rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <div class="card card-custom p-5">
                    <div class="mb-3 icon-huge">✨💅</div>
                    <h1 class="salon-title fw-bold mb-3">¡Cita Agendada con Éxito!</h1>
                    <p class="text-muted fs-5 mb-4">Tu espacio ya está reservado. ¡Te esperamos en DanasNails para
                        consentirte!</p>
                    <a href="/" class="btn btn-custom w-100 fs-5 shadow-sm">Volver al inicio</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
