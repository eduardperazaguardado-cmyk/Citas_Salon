<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanasNails - Uñas y Spa</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <!-- Flatpickr (Calendario Premium) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/airbnb.css">

    <style>
        body {
            background-color: #fcf8fa;
            font-family: 'Poppins', sans-serif;
        }

        .salon-title {
            font-family: 'Playfair Display', serif;
            color: #831843;
        }

        .card-custom {
            border: none;
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(225, 29, 72, 0.08);
            overflow: hidden;
        }

        /* Entradas de texto lujosas */
        .form-control,
        .form-select {
            border-radius: 12px;
            border: 1.5px solid #fce7f3;
            padding: 14px 18px;
            background-color: #fffafc;
            color: #4c1d95;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #fb7185;
            box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.15);
            background-color: #ffffff;
        }

        /* Botones de Horarios Premium (Pills) */
        .btn-outline-premium {
            color: #e11d48;
            background-color: #fff0f2;
            border: 1px solid #fda4af;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-check:checked+.btn-outline-premium {
            background-color: #e11d48;
            color: white;
            border-color: #e11d48;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }

        .btn-outline-premium:hover {
            background-color: #ffe4e6;
        }

        /* Botón Principal */
        .btn-custom {
            background-color: #fb7185;
            border: none;
            color: white;
            border-radius: 14px;
            padding: 15px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background-color: #e11d48;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(225, 29, 72, 0.25);
        }

        .header-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .label-custom {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9f1239;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card card-custom">

                    <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
                        class="header-image" alt="DanasNails Spa">

                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-5">
                            <h1 class="salon-title fw-bold">DanasNails</h1>
                            <p class="text-muted" style="font-size: 0.95rem;">Reserva tu momento de relajación y belleza
                            </p>
                        </div>

                        <form action="/agendar" method="POST">
                            <div class="mb-4">
                                <label for="nombre" class="form-label fw-bold label-custom">Tu Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre"
                                    placeholder="Ej. Valeria López" required>
                            </div>

                            <div class="mb-4">
                                <label for="telefono" class="form-label fw-bold label-custom">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono"
                                    placeholder="Ej. 7777-7777" required>
                            </div>

                            <div class="mb-4">
                                <label for="servicio" class="form-label fw-bold label-custom">Servicio</label>
                                <select class="form-select cursor-pointer" id="servicio" name="servicio" required>
                                    <option value="" disabled selected>✨ Selecciona cómo quieres consentirte...</option>
                                    {% for servicio in servicios %}
                                    <option value="{{ servicio[0] }}">{{ servicio[1] }} - ${{ "%.2f"|format(servicio[3])
                                        }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="fecha" class="form-label fw-bold label-custom">Fecha de la cita</label>
                                <!-- El selector de fecha ahora usará Flatpickr -->
                                <input type="text" class="form-control bg-white" id="fecha" name="fecha"
                                    placeholder="Selecciona un día en el calendario..." required readonly>
                            </div>

                            <div class="mb-5">
                                <label class="form-label fw-bold label-custom">Horarios Disponibles</label>
                                <!-- Aquí JavaScript insertará los botones elegantes de las horas -->
                                <div id="contenedor-horas" class="p-3 border rounded-4 bg-white"
                                    style="border-color: #fce7f3 !important;">
                                    <p class="text-muted mb-0" style="font-size: 0.9rem;">👈 Primero elige una fecha
                                        para ver los espacios libres.</p>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-custom w-100 fs-5">Reservar mi Cita ✨</button>

                            <div class="text-center mt-4">
                                <a href="/mis_citas" class="text-decoration-none fw-medium"
                                    style="color: #fb7185; font-size: 0.9rem;">
                                    ¿Necesitas cancelar o revisar tu cita? Haz clic aquí
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts para hacer funcionar la magia visual -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>

    <script>
        // 1. Iniciamos el calendario premium (Flatpickr) en español
        flatpickr("#fecha", {
            locale: "es",
            minDate: "today",
            dateFormat: "Y-m-d",
            disableMobile: true, // Fuerza el diseño premium en celulares
            onChange: function (selectedDates, dateStr, instance) {
                buscarHoras(dateStr);
            }
        });

        // 2. Lógica para buscar horas y convertirlas en botones elegantes
        const contenedorHoras = document.getElementById('contenedor-horas');

        function buscarHoras(fechaSeleccionada) {
            contenedorHoras.innerHTML = '<div class="spinner-border text-danger spinner-border-sm" role="status"></div> <span class="text-muted ms-2">Buscando espacios...</span>';

            fetch(`/horas_disponibles?fecha=${fechaSeleccionada}`)
                .then(respuesta => respuesta.json())
                .then(horasLibres => {
                    if (horasLibres.length === 0) {
                        contenedorHoras.innerHTML = '<p class="text-danger fw-medium mb-0">Día completamente lleno 😔. Por favor elige otra fecha.</p>';
                    } else {
                        // Creamos una cuadrícula de botones para las horas
                        let htmlBotones = '<div class="d-flex flex-wrap gap-2">';

                        horasLibres.forEach(hora => {
                            let horaNum = parseInt(hora.substring(0, 2));
                            let ampm = horaNum >= 12 ? 'PM' : 'AM';
                            let hora12 = horaNum > 12 ? horaNum - 12 : horaNum;
                            if (hora12 === 0) hora12 = 12;
                            let horaBonita = `${hora12.toString().padStart(2, '0')}:00 ${ampm}`;

                            // Input tipo radio oculto + Etiqueta visual de botón
                            htmlBotones += `
                                <div>
                                    <input type="radio" class="btn-check" name="hora" id="hora_${hora}" value="${hora}" required>
                                    <label class="btn-outline-premium" for="hora_${hora}">${horaBonita}</label>
                                </div>
                            `;
                        });

                        htmlBotones += '</div>';
                        contenedorHoras.innerHTML = htmlBotones;
                    }
                })
                .catch(error => {
                    contenedorHoras.innerHTML = '<p class="text-danger mb-0">Error al cargar las horas.</p>';
                });
        }
    </script>
</body>

</html>
